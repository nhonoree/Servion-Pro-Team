<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Number Input</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }
        
        h1 {
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-size: 2.2rem;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2575fc;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #6a11cb;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.2);
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 42px;
            color: #6a11cb;
            font-size: 18px;
        }
        
        .validation-message {
            font-size: 14px;
            margin-top: 5px;
            display: none;
            color: #e74c3c;
        }
        
        .valid {
            color: #27ae60;
        }
        
        .submit-btn {
            background: #6a11cb;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            background: #2575fc;
        }
        
        .phone-examples {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: white;
            font-size: 14px;
        }
        
        .success-message {
            display: none;
            background: #27ae60;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <h1>Phone Number Input</h1>
    
    <div class="container">
        <form id="phoneForm">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <i class="fas fa-phone input-icon"></i>
                <input type="tel" name="entry.616492044" id="phone" class="form-control" 
                       placeholder="Enter your phone number" required
                       pattern="[0-9]{10,15}" 
                       title="Please enter a valid phone number (10-15 digits)">
                <div class="validation-message" id="validationMessage">
                    Please enter a valid phone number (10-15 digits)
                </div>
                <div class="phone-examples">
                    Examples: 250788123456 or 1234567890
                </div>
            </div>
            
            <button type="submit" class="submit-btn">Submit</button>
            
            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i> Thank you! Your information has been submitted.
            </div>
        </form>
    </div>
    
    <div class="footer">
        <p>Phone Input Example &copy; 2023</p>
    </div>

    <script>
        document.getElementById('phoneForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phoneInput = document.getElementById('phone');
            const validationMessage = document.getElementById('validationMessage');
            const successMessage = document.getElementById('successMessage');
            
            // Validate phone number
            if (!phoneInput.checkValidity()) {
                validationMessage.style.display = 'block';
                phoneInput.focus();
                return;
            }
            
            // If valid, show success message
            validationMessage.style.display = 'none';
            successMessage.style.display = 'block';
            
            // In a real scenario, you would submit the form to Google Forms here
            console.log('Phone number submitted:', phoneInput.value);
            
            // Reset form after 2 seconds
            setTimeout(() => {
                successMessage.style.display = 'none';
                this.reset();
            }, 2000);
        });
        
        // Real-time validation
        document.getElementById('phone').addEventListener('input', function() {
            const validationMessage = document.getElementById('validationMessage');
            
            if (this.value.length > 0 && !this.checkValidity()) {
                validationMessage.style.display = 'block';
            } else {
                validationMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
